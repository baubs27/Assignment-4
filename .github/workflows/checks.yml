name: Workstation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKET_LIVE: '0'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend packages
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Verify indicators, accounting, backtests, and APIs
        run: python -m pytest tests -q
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci
      - name: Build the dashboard
        working-directory: frontend
        run: npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test the actual Vue dashboard and FastAPI server
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
